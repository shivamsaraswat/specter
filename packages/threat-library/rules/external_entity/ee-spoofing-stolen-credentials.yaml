id: ee-spoofing-stolen-credentials
element_type: external_entity
category: Spoofing
title: "Stolen credentials let an attacker act as {{element}}"
description: >-
  {{element}} proves who it is with a credential such as a password, key or token. If that
  credential is stolen, leaked or guessed, the attacker is indistinguishable from the real entity
  until someone notices.
likelihood: Medium
impact: High
when:
  flags:
    authenticated: yes
mitigations:
  - Prefer credentials that are hard to steal and easy to revoke, such as short-lived tokens or
    hardware-backed keys, over long-lived shared secrets.
  - Store credentials in a secrets manager and keep them out of source code, logs and chat.
  - Rotate credentials on a schedule and immediately after a suspected leak, and make revocation
    quick.
  - Alert on sign-ins from unusual places, times or volumes.
references:
  - CWE-798
  - CWE-522
  - CAPEC-560
examples:
  applies:
    - flags: { authenticated: yes }
  does_not_apply:
    - flags: { authenticated: no }
    - {}
