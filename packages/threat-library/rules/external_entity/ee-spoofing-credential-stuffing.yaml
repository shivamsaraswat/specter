id: ee-spoofing-credential-stuffing
element_type: external_entity
category: Spoofing
title: "Reused passwords let attackers sign in as {{element}}"
description: >-
  {{element}} authenticates over the public internet. Attackers try passwords leaked from other
  services against it, and anyone who reuses a password is exposed even though nothing in this
  system was breached.
likelihood: Medium
impact: Medium
when:
  flags:
    authenticated: yes
    internet_facing: yes
mitigations:
  - Throttle failed sign-ins per account and per source address, without locking the real owner out.
  - Offer or require a second factor.
  - Reject passwords that appear in known breach lists when they are set.
  - Alert the owner on sign-ins from new places or devices.
references:
  - CWE-307
  - CAPEC-600
examples:
  applies:
    - flags: { authenticated: yes, internet_facing: yes }
  does_not_apply:
    - flags: { authenticated: yes, internet_facing: no }
    - flags: { authenticated: no, internet_facing: yes }
